<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2b33"/>
      <stop offset="1" stop-color="#121317"/>
    </linearGradient>
    <!-- dégradés en coordonnées absolues : bulle et pointe partagent la même teinte -->
    <linearGradient id="acc" gradientUnits="userSpaceOnUse" x1="200" y1="104" x2="412" y2="300">
      <stop offset="0" stop-color="#ffb84d"/>
      <stop offset="1" stop-color="#f0782a"/>
    </linearGradient>
    <linearGradient id="card" gradientUnits="userSpaceOnUse" x1="0" y1="208" x2="0" y2="420">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9e9ee"/>
    </linearGradient>
  </defs>
  <!-- fond -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="107.5" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>
  <!-- bulle du pair, en arrière : il est en train de répondre -->
  <g fill="url(#acc)" stroke="url(#acc)">
    <rect x="200" y="104" width="228" height="148" rx="40" stroke="none"/>
    <path d="M330 240 L404 290 L392 232 Z" stroke-width="12" stroke-linejoin="round"/>
  </g>
  <circle cx="264" cy="178" r="15" fill="#1b1c21"/>
  <circle cx="314" cy="178" r="15" fill="#1b1c21"/>
  <circle cx="364" cy="178" r="15" fill="#1b1c21"/>
  <!-- bulle de l'agent au premier plan : avatar et deux lignes, comme la carte d'agent-profiles -->
  <g fill="url(#card)" stroke="url(#card)">
    <rect x="84" y="208" width="276" height="168" rx="40" stroke="none"/>
    <path d="M118 364 L108 414 L178 368 Z" stroke-width="12" stroke-linejoin="round"/>
  </g>
  <circle cx="158" cy="292" r="36" fill="#1b1c21"/>
  <rect x="214" y="264" width="104" height="20" rx="10" fill="#1b1c21"/>
  <rect x="214" y="302" width="66" height="16" rx="8" fill="#1b1c21" fill-opacity="0.32"/>
</svg>
